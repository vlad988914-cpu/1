name: Tender digest
on:
  schedule:
    # Пн і Пт. GitHub рахує час в UTC: 06:00 і 07:00 UTC, скрипт сам лишає той запуск,
    # коли в Києві 9-та година (взимку 07:00 UTC, влітку 06:00 UTC).
    - cron: "0 6,7 * * 1,5"
  workflow_dispatch:
jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/tender-digest.mjs
        env:
          TG_REPORT_TOKEN: ${{ secrets.TG_REPORT_TOKEN }}
          TG_REPORT_CHAT: ${{ secrets.TG_REPORT_CHAT }}
