name: Tender digest
on:
  schedule:
    - cron: "0 6 * * 1" # понеділок 06:00 UTC = 08:00/09:00 Київ
  workflow_dispatch:
jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/tender-digest.mjs
        env:
          TG_REPORT_TOKEN: ${{ secrets.TG_REPORT_TOKEN }}
          TG_REPORT_CHAT: ${{ secrets.TG_REPORT_CHAT }}
